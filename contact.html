    <main class="page-shell contact-page" id="home">
      <section class="contact-section" aria-labelledby="contact-title">
        <div class="resource-page-heading">
          <h1 id="contact-title">Contact</h1>
          <p>For editorial, rights, event, interview, or website inquiries, please use the form below.</p>
        </div>
        <form class="contact-form" action="https://api.web3forms.com/submit" method="post" data-contact-form data-sending="Sending…" data-success="Message sent successfully. Thank you for getting in touch." data-error="Your message could not be sent. Please try again.">
          <input type="hidden" name="access_key" value="eaf66692-e985-4b29-9f70-c0dd161784e3" />
          <input type="hidden" name="subject" value="【伏鳞个人网站】新留言" data-contact-subject />
          <input type="hidden" name="from_name" value="Skye Loong Website" />
          <input class="contact-botcheck" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <div class="contact-field"><label for="contact-name">Name <span class="required-marker" aria-hidden="true">*</span></label><input id="contact-name" name="name" type="text" autocomplete="name" required /></div>
          <div class="contact-field"><label for="contact-email">Email <span class="required-marker" aria-hidden="true">*</span></label><input id="contact-email" name="email" type="email" autocomplete="email" required /></div>
          <div class="contact-field"><label for="contact-topic">Topic</label><select id="contact-topic" name="topic"><option value="" selected>Select a topic</option><option>Submissions, Commissions &amp; Publishing</option><option>Translation, Reprints &amp; Rights</option><option>Events &amp; Interviews</option><option>Website Issues &amp; Suggestions</option><option>Other Collaborations or Inquiries</option></select></div>
          <div class="contact-field"><label for="contact-message">Message <span class="required-marker" aria-hidden="true">*</span></label><textarea id="contact-message" name="message" rows="8" maxlength="4000" required></textarea></div>
          <button class="contact-submit" type="submit"><span data-submit-label>Send message</span></button>
          <p class="contact-status" data-contact-status role="status" aria-live="polite"></p>
          <p class="contact-privacy">Your information will only be used to reply to this message.</p>
        </form>
      </section>
