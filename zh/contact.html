    <main class="page-shell contact-page" id="home">
      <section class="contact-section" aria-labelledby="contact-title">
        <div class="resource-page-heading">
          <h1 id="contact-title">联系我</h1>
          <p>如需洽询编辑出版、翻译版权、活动采访或网站相关事项，请填写以下表格。</p>
        </div>
        <form class="contact-form" action="https://api.web3forms.com/submit" method="post" data-contact-form data-sending="正在发送…" data-success="留言已成功发送！谢谢你的来信。" data-error="留言未能发送，请稍后重试。" data-captcha-error="请先完成人机验证，再发送留言。">
          <input type="hidden" name="access_key" value="eaf66692-e985-4b29-9f70-c0dd161784e3" />
          <input type="hidden" name="subject" value="【伏鳞个人网站】新留言" data-contact-subject />
          <input type="hidden" name="from_name" value="伏鳞个人网站" />
          <input class="contact-botcheck" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true" />
          <div class="contact-field"><label for="contact-name">姓名 <span class="required-marker" aria-hidden="true">*</span></label><input id="contact-name" name="name" type="text" autocomplete="name" required /></div>
          <div class="contact-field"><label for="contact-email">邮箱 <span class="required-marker" aria-hidden="true">*</span></label><input id="contact-email" name="email" type="email" autocomplete="email" required /></div>
          <div class="contact-field"><label for="contact-topic">主题</label><select id="contact-topic" name="topic"><option value="" selected>请选择主题</option><option>出版与约稿洽询</option><option>翻译、转载与版权授权</option><option>活动与采访</option><option>网站问题与建议</option><option>其他合作或咨询</option></select></div>
          <div class="contact-field"><label for="contact-message">留言 <span class="required-marker" aria-hidden="true">*</span></label><textarea id="contact-message" name="message" rows="8" maxlength="4000" required></textarea></div>
          <div class="h-captcha contact-captcha" data-captcha="true" data-lang="zh-CN"></div>
          <button class="contact-submit" type="submit"><span data-submit-label>发送留言</span></button>
          <p class="contact-status" data-contact-status role="status" aria-live="polite"></p>
          <p class="contact-privacy">你的姓名、邮箱和留言仅用于回复本次咨询。</p>
        </form>
      </section>
